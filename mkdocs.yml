site_name: TROPICOR
site_description: Tropical Correction and Orographic Resolution — AI framework for bias correction and spatial downscaling of global climate reanalyses across tropical complex terrains
site_author: Mateo Hernández Gualdrón
site_url: https://mhgualdron.github.io/tropicor/
repo_name: mhgualdron/tropicor
repo_url: https://github.com/mhgualdron/tropicor

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guides:
      - ERA5 Extraction: guides/era5-extraction.md
      - Orographic Correction: guides/orographic-correction.md
      - Annual Climatology & Seasonal Curves: guides/climatology.md
      - IDEAM DHIME Reader: guides/ideam-dhime.md
      - Station Catalog: guides/station-catalog.md
  - Science & Methodology:
      - Academic Heritage & Orography: science/overview.md
      - Physical Lapse Rates: science/lapse-rate.md
      - Verification Metrics: science/metrics.md
  - API Reference:
      - tropicor.core: api/core.md
      - tropicor.downscale: api/downscale.md
      - tropicor.io: api/io.md
