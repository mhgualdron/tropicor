[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tropicor"
version = "0.1.4"
description = "Python framework for orographic bias correction and validation of global climate reanalyses in complex tropical terrain"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Mateo Hernandez Gualdron", email = "tropicor.project@gmail.com"}
]
keywords = ["climate", "ERA5", "downscaling", "bias-correction", "tropical", "geoscience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Development Status :: 1 - Planning",
]
dependencies = [
    "xarray>=2024.0",
    "netcdf4>=1.6",
    "cdsapi>=0.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
viz-interactive = ["plotly>=5.20"]
parallel = ["dask>=2024.0", "distributed>=2024.0"]
grib = ["cfgrib>=0.9.10", "eccodes>=2.30"]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs",
    "scipy-stubs",
    "jupyter",
    "ipykernel",
    "nbclient",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pymannkendall>=1.4.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/mhgualdron/tropicor"
Repository = "https://github.com/mhgualdron/tropicor"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["scratch", "local"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tropicor*"]

[tool.setuptools.package-data]
tropicor = ["data/boundaries/*.geojson", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

